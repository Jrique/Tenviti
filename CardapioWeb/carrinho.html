<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sacola - LD Lanches</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/tema-loja.css" />
</head>
<body>

    <header class="header">
        <div class="limite header-container">
            <div class="header-left">
                <div class="brand-logo">
                    <img src="images/logo.png" alt="Logo LD Lanches" />
                </div>
                <div class="header-info">
                    <a href="index.html" class="logo-text">LD Lanches</a>
                    <div class="loja-status">
                        <span class="loja-status-titulo" id="loja-status-flag">Entrega Rápida</span>
                        <span class="loja-status-desc" id="loja-status-desc">Tempo médio 30 min - Região Centro</span>
                    </div>
                </div>
            </div>

            <div class="header-right">

                <button type="button" class="header-icon-btn" id="btn-header-entrega" aria-label="Dados de entrega">
                    <img src="images/perfil.png" alt="Dados de entrega" />
                </button>

                <a href="carrinho.html" class="header-icon-btn">
                    <img src="images/sacola.png" alt="Sacola" />
                    <span id="cart-badge" class="cart-badge">0</span>
                </a>
            </div>
        </div>
    </header>

    <div id="modal-perfil" class="modal-overlay">
        <div class="modal-card">
            <button class="modal-close" id="modal-close-btn">✕</button>
    
            <div class="modal-titulo">
                <span>Dados para Entrega</span>
            </div>
    
            <div class="modal-msg">
                Preencha seus dados. Vamos salvar para facilitar seus próximos pedidos.
            </div>
    
            <form id="perfil-form" class="modal-form">
                <div>
                    <label>Nome completo</label>
                    <input id="perfilNome" type="text" placeholder="Seu nome completo" required />
                </div>
    
                <div>
                    <label>CEP</label>
                    <input id="perfilCep" type="text" placeholder="Apenas números" maxlength="9" />
                </div>
    
                <div>
                    <label>Rua / Logradouro</label>
                    <input id="perfilLogradouro" type="text" placeholder="Ex: Rua das Palmeiras" required />
                </div>
    
                <div>
                    <label>Número</label>
                    <input id="perfilNumero" type="text" placeholder="Ex: 123" required />
                </div>
    
                <div>
                    <label>Bairro</label>
                    <input id="perfilBairro" type="text" placeholder="Ex: Centro" required />
                </div>
    
                <div>
                    <label>Cidade</label>
                    <input id="perfilCidade" type="text" placeholder="Ex: São Paulo" required />
                </div>
    
                <div>
                    <label>UF</label>
                    <input id="perfilUf" type="text" placeholder="Ex: SP" maxlength="2" />
                </div>
    
                <div>
                    <label>Telefone / WhatsApp</label>
                    <input id="perfilTelefone" type="tel" placeholder="(00) 00000-0000" required />
                </div>
    
                <div>
                    <label>Complemento / Referência</label>
                    <textarea id="perfilComplemento" rows="2" placeholder="Apartamento, portão, ponto de referência"></textarea>
                </div>
            </form>
    
            <div class="modal-actions">
                <button class="modal-btn-primary" id="perfil-salvar-btn">
                    <span>Salvar</span>
                </button>
                <button class="modal-btn-secundario" id="modal-cancelar-btn">
                    Cancelar
                </button>
            </div>
        </div>
    </div>
    

    <main class="limite carrinho-page">

        <h2 class="carrinho-titulo">Seu pedido</h2>

        <div id="cart-itens-container" class="carrinho-lista"></div>

        <div id="summary-container" class="resumo-card"></div>

        <div class="checkout-btn-wrapper">
            <a id="checkout-link" class="checkout-btn" href="checkout.html">
                <span>Finalizar pedido</span>
            </a>
        </div>

        <div class="espaco-bottom-nav"></div>
    </main>

    <button class="whats-fab" id="btn-whats-flutuante" aria-label="Atendimento WhatsApp">
        <img src="images/whatsapp.png" alt="WhatsApp" />
    </button>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-link">
            <img src="images/inicio.png" class="icon-nav" alt="Início" />
            <span class="nav-texto">Início</span>
        </a>

        <a href="carrinho.html" class="nav-link active">
            <img src="images/sacola.png" class="icon-nav" alt="Sacola" />
            <span class="nav-texto">Sacola</span>
        </a>

        <a href="pedidos.html" class="nav-link">
            <img src="images/pedidos.png" class="icon-nav" alt="Pedidos" />
            <span class="nav-texto">Pedidos</span>
        </a>

    </nav>
    

    <script src="script.js"></script>
    <script>
        
        function renderCarrinho() {
            const cartItensContainer = document.getElementById('cart-itens-container');
        const summaryContainer = document.getElementById('summary-container');
        const checkoutLink = document.getElementById('checkout-link');

        const salvarBtn = document.getElementById('perfil-salvar-btn');
        const cancelBtn = document.getElementById('modal-cancelar-btn');
        const closeBtn  = document.getElementById('modal-close-btn');

        if (salvarBtn) salvarBtn.addEventListener('click', salvarPerfilDoModal);
        if (cancelBtn) cancelBtn.addEventListener('click', fecharModalPerfilGlobal);
        if (closeBtn)  closeBtn.addEventListener('click', fecharModalPerfilGlobal);

        const perfil = getPerfil();
        if (perfilIncompleto(perfil)) {
            abrirModalPerfilGlobal();
            if (typeof registrarEventosCepPerfil === 'function') {
                registrarEventosCepPerfil();
            }
        }

        const cart = getCart();
        atualizarBadgeCarrinho();

        if (cart.length === 0) {
            cartItensContainer.innerHTML = '<p class="carrinho-vazio">Sua sacola está vazia.</p>';
            summaryContainer.innerHTML = '';
            checkoutLink.style.display = 'none';
            return;
        }

        cartItensContainer.innerHTML = '';

        // ---- monta cada item do carrinho ----
        cart.forEach((item, indice) => {
            const totalExtrasItem = (item.extras || []).reduce(
                (soma, extra) => soma + (extra.preco * extra.qtd),
                0
            );
            const totalItem = valorItem(item);

            let extrasHtml = '';
            if (item.extras && item.extras.length > 0) {
                extrasHtml = `
                    <div class="item-extras">
                        ${item.extras.map(extra => `
                            <div class="item-extra-linha">
                                + ${extra.nome} x${extra.qtd}
                                ${extra.preco > 0
                                    ? ` (R$ ${(extra.preco * extra.qtd).toFixed(2).replace('.', ',')})`
                                    : ''
                                }
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            const itemEl = `
                <div class="carrinho-item">
                    <img src="${item.imagemUrl}" alt="${item.nome}">
                    <div class="item-info">
                        <h4>${item.nome}</h4>
                        ${extrasHtml}
                        <div class="item-info-preco">
                            R$ ${totalItem.toFixed(2).replace('.', ',')}
                        </div>
                    </div>
                    <div class="item-controles">
                        <button class="item-btn-qty"
                            onclick="alterarQuantidadeLinha(${indice}, 'remove'); location.reload();">
                            -
                        </button>
                        <span>${item.quantidade}</span>
                        <button class="item-btn-qty"
                            onclick="alterarQuantidadeLinha(${indice}, 'add'); location.reload();">
                            +
                        </button>
                    </div>
                </div>
            `;

            cartItensContainer.insertAdjacentHTML('beforeend', itemEl);
        });

        // ---- subtotal, entrega e total ----
        const subtotal = cart.reduce((acc, item) => {
            const totalExtrasItem = (item.extras || []).reduce(
                (soma, extra) => soma + (extra.preco * extra.qtd),
                0
            );
            return acc + valorItem(item);
        }, 0);

        const entrega = typeof taxaEntrega !== 'undefined' ? taxaEntrega : 5.00;
        const total = subtotal + entrega;

        summaryContainer.innerHTML = `
            <div class="resumo-linha">
                <span>Subtotal</span>
                <span>R$ ${subtotal.toFixed(2).replace('.', ',')}</span>
            </div>
            <div class="resumo-linha">
                <span>Entrega</span>
                <span>R$ ${entrega.toFixed(2).replace('.', ',')}</span>
            </div>
            <div class="resumo-linha total">
                <span>Total</span>
                <span>R$ ${total.toFixed(2).replace('.', ',')}</span>
            </div>
        `;

        checkoutLink.addEventListener('click', (e) => {
            if (!exigirPerfilOuRedirecionar()) {
                e.preventDefault();
            }
        });
    }
            

        document.addEventListener('DOMContentLoaded', () => {
            renderCarrinho();
            configurarBotaoWhatsFlutuante();
            atualizarStatusLoja();
            configurarBotaoHeaderEntrega();
        });
    </script>
</body>
</html>
