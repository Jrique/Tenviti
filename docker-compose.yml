# Ambiente local: PostgreSQL + servidor Ktor (que também serve o cardápio web em /{loja}/).
# Uso:  cp .env.exemplo .env  (preencha)  →  docker compose up -d --build
services:
  banco:
    image: postgres:16-alpine
    container_name: cardapio-banco
    environment:
      POSTGRES_DB: cardapio
      POSTGRES_USER: cardapio
      POSTGRES_PASSWORD: ${DB_SENHA:?defina DB_SENHA no .env}
    volumes:
      - banco-dados:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardapio -d cardapio"]
      interval: 5s
      timeout: 3s
      retries: 20

  servidor:
    build:
      context: .
      dockerfile: LDLanchesASW/server/Dockerfile
    container_name: cardapio-servidor
    depends_on:
      banco:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://banco:5432/cardapio
      DB_USUARIO: cardapio
      DB_SENHA: ${DB_SENHA}
      JWT_SEGREDO: ${JWT_SEGREDO:?defina JWT_SEGREDO no .env (openssl rand -hex 32)}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_SENHA: ${SUPERADMIN_SENHA:-}
      CORS_ORIGENS: ${CORS_ORIGENS:-http://localhost:8080}
      CARDAPIO_WEB_DIR: /app/cardapio-web
      MIDIA_DIR: /app/midia
    volumes:
      # Desenvolvimento: alterações no CardapioWeb aparecem sem rebuild da imagem
      - ./CardapioWeb:/app/cardapio-web:ro
      # Imagens enviadas pelas lojas (fotos de produto, logo, banner)
      - midia:/app/midia
    ports:
      - "8081:8081"

volumes:
  banco-dados:
  midia:
